<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>타임폴리오 ETF 터미널</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    :root {
      --bg-color: #0f172a; /* 딥 네이비/블랙 배경 */
      --panel-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #10b981; /* 터미널 그린 */
      --accent-blue: #3b82f6;
      --accent-red: #ef4444;
      --accent-yellow: #f59e0b;
      --border-color: #334155;
    }

    body {
      font-family: 'Pretendard', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    header {
      border-bottom: 2px solid var(--accent-blue);
      padding-bottom: 15px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 1.8rem;
      margin: 0 0 10px 0;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .update-time {
      font-size: 0.9rem;
      color: var(--accent-green);
      font-family: monospace;
      font-weight: 600;
    }

    .etf-card {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      margin-bottom: 25px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .etf-header {
      padding: 16px 20px;
      background-color: #0b1120;
      border-bottom: 1px solid var(--border-color);
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--accent-blue);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stock-item {
      padding: 20px;
      border-bottom: 1px dashed var(--border-color);
    }

    .stock-item:last-child {
      border-bottom: none;
    }

    .stock-header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 15px;
    }

    .stock-name {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .badge {
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 800;
    }

    .badge.신규 {
      background-color: rgba(245, 158, 11, 0.15);
      color: var(--accent-yellow);
      border: 1px solid var(--accent-yellow);
    }

    .badge.증가 {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
    }

    .weight {
      color: var(--accent-green);
      font-size: 1rem;
      font-family: monospace;
      font-weight: bold;
      background-color: #0b1120;
      padding: 4px 10px;
      border-radius: 4px;
    }

    .ai-reason {
      background-color: #0b1120;
      padding: 16px;
      border-radius: 8px;
      border-left: 4px solid var(--accent-blue);
      font-size: 1rem;
      color: #cbd5e1;
      word-break: keep-all;
    }
    
    .ai-reason::before {
      content: '🤖 AI 매수 추론: ';
      font-weight: 800;
      color: var(--accent-blue);
    }

    .empty-msg {
      padding: 25px;
      text-align: center;
      color: var(--text-muted);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚡ 타임폴리오 하우스 압축픽 & 엑시트 경보</h1>
      <div class="update-time" id="updateTime">SYS_LOADING_DATA...</div>
    </header>
    
    <div id="etfContainer"></div>
  </div>

  <script>
    // GitHub 설정
    const GITHUB_USERNAME = "dandanpapa21-afk";
    const GITHUB_REPO = "timefolio-tracker";
    const JSON_URL = `https://${GITHUB_USERNAME}.github.io/${GITHUB_REPO}/data.json`;

    async function fetchData() {
      try {
        const response = await fetch(JSON_URL + '?t=' + new Date().getTime());
        if (!response.ok) throw new Error('데이터 통신 오류');
        
        const data = await response.json();
        renderData(data);
      } catch (error) {
        document.getElementById('updateTime').innerText = "[ERROR] 데이터를 불러오지 못했습니다.";
      }
    }

    function renderData(data) {
      document.getElementById('updateTime').innerText = `[SYS_UPDATE] ${data.updateTime} (Terminal OS)`;
      
      const container = document.getElementById('etfContainer');
      container.innerHTML = '';

      if (!data.etfs || data.etfs.length === 0) {
        container.innerHTML = '<div class="etf-card"><div class="empty-msg">포착된 유의미한 자본 이동이 없습니다.</div></div>';
        return;
      }

      data.etfs.forEach(etf => {
        let changesHtml = '';
        
        if (etf.changes.length === 0) {
           // 변동이 없는 ETF는 화면에 아예 표시하지 않음 (압축 뷰)
           return; 
        } else {
          etf.changes.forEach(item => {
            const badgeClass = item.type === '신규' ? '신규' : '증가';
            const badgeText = item.type === '신규' ? '⭐ 신규편입' : '🔺 단기증가';
            
            changesHtml += `
              <div class="stock-item">
                <div class="stock-header">
                  <span class="badge ${badgeClass}">${badgeText}</span>
                  <span class="stock-name">${item.stock}</span>
                  <span class="weight">${item.weightChange}</span>
                </div>
                <div class="ai-reason">${item.aiReason}</div>
              </div>
            `;
          });
        }

        const etfCard = `
          <div class="etf-card">
            <div class="etf-header">
              <span>📊 ${etf.name} (핵심 섹터 비중)</span>
            </div>
            <div class="etf-body">
              ${changesHtml}
            </div>
          </div>
        `;
        container.innerHTML += etfCard;
      });
    }

    fetchData();
  </script>
</body>
</html>
